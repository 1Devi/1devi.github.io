<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-hover: #eef2f8;
        --border: #e0e3e9;
        --border-hover: #c3cad6;
        --text: #15171c;
        --muted: #5b6270;
        --accent: #2b7de9;
        --shadow: 0 1px 2px rgb(16 18 23 / 0.05);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101217;
          --surface: #181b22;
          --surface-hover: #20242d;
          --border: #2a2f39;
          --border-hover: #404756;
          --text: #e9ebef;
          --muted: #9aa2b1;
          --accent: #6ea8ff;
          --shadow: none;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: clamp(40px, 9vh, 88px) 16px 64px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Header */
      .profile {
        text-align: center;
        margin-bottom: 32px;
      }
      .avatar {
        display: block;
        width: 112px;
        height: 112px;
        margin: 0 auto 16px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--border);
        box-shadow: 0 0 0 1px var(--border);
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .bio {
        margin: 6px 0 0;
        color: var(--muted);
      }

      /* Social links: full-width buttons, icon on the left, label centered */
      .links {
        display: grid;
        gap: 12px;
      }
      .link {
        display: grid;
        grid-template-columns: 24px 1fr 24px;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 12px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        color: inherit;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        transition: background-color 0.15s, border-color 0.15s;
      }
      button.link {
        width: 100%;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .link::after {
        content: ''; /* empty third column keeps the label centered */
      }
      .icon {
        display: block;
        width: 22px;
        height: 22px;
        justify-self: center;
      }

      /* Projects */
      h2 {
        margin: 40px 0 12px;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .projects {
        display: grid;
        gap: 12px;
      }
      .project {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transition: background-color 0.15s, border-color 0.15s;
      }
      .project-logo {
        flex: none;
        display: block;
        width: 44px;
        height: 44px;
      }
      .project-body {
        flex: 1;
        min-width: 0;
      }
      .project-name {
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      .project-name::after {
        /* makes the whole card clickable */
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
      }
      .project-name:focus-visible {
        outline: none;
      }
      .project-name:focus-visible::after {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .project-desc {
        margin: 2px 0 8px;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      .project-alt {
        position: relative;
        z-index: 1;
        color: var(--accent);
        font-size: 0.875rem;
        text-decoration: none;
      }
      .project-mark {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
        font-size: 1.25rem;
        font-weight: 700;
      }
      .project-meta {
        display: flex;
        gap: 12px;
        color: var(--muted);
        font-size: 0.875rem;
      }
      .project-arrow {
        flex: none;
        align-self: center;
        width: 20px;
        height: 20px;
        color: var(--muted);
      }

      @media (hover: hover) {
        .link:hover,
        .project:hover {
          background: var(--surface-hover);
          border-color: var(--border-hover);
        }
        .project-alt:hover {
          text-decoration: underline;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .link,
        .project {
          transition: none;
        }
      }
    </style>
  </head>

      <section aria-labelledby="projects-title">
        <h2 id="projects-title">Projects</h2>
        <!-- Filled from GitHub by the script below (public repos, newest first). This card is
             the fallback when the API is unavailable or scripts don't run, e.g. for crawlers. -->
        <ul class="projects" id="projects">
          <li class="project">
            <svg class="project-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect x="2" y="2" width="28" height="28" rx="8" fill="#2b7de9" />
              <path d="M13 10.5v11l8.5-5.5z" fill="#fff" />
            </svg>
            <div class="project-body">
              <a class="project-name" href="/video-to-tg-sticker/">TG Sticker Maker</a>
              <p class="project-desc">Turn any video into a Telegram video sticker</p>
              <a class="project-alt" href="/video-to-tg-sticker/?lang=ru" hreflang="ru" lang="ru">На русском</a>
            </div>
            <svg class="project-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="m9 6 6 6-6 6" />
            </svg>
          </li>
        </ul>
      </section>
    </main>
    <script>
      // Full years since 20.03.2002.
      const born = new Date(2002, 2, 20);
      const now = new Date();
      const hadBirthday =
        now.getMonth() > born.getMonth() || (now.getMonth() === born.getMonth() && now.getDate() >= born.getDate());
      document.getElementById('age').textContent = now.getFullYear() - born.getFullYear() - (hadBirthday ? 0 : 1);

      // Projects: public, non-fork, non-archived repos. Add the topic "profile-hide" to a repo to skip it.
      const USER = '1Devi';
      const SITE = 'https://1devi.github.io/';

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function projectCard(repo) {
        const homepage = repo.homepage && (/^https?:\/\//.test(repo.homepage) ? repo.homepage : 'https://' + repo.homepage);
        const url = homepage || (repo.has_pages ? SITE + repo.name + '/' : repo.html_url);
        const card = el('li', 'project');
        card.append(el('span', 'project-mark', repo.name[0].toUpperCase()));
        const body = el('div', 'project-body');
        const name = el('a', 'project-name', repo.name);
        name.href = url;
        body.append(name);
        if (repo.description) body.append(el('p', 'project-desc', repo.description));
        const meta = el('div', 'project-meta');
        if (repo.language) meta.append(el('span', '', repo.language));
        if (url !== repo.html_url) {
          const source = el('a', 'project-alt', 'Source');
          source.href = repo.html_url;
          meta.append(source);
        }
        if (meta.childElementCount) body.append(meta);
        card.append(body);
        card.insertAdjacentHTML(
          'beforeend',
          '<svg class="project-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6" /></svg>',
        );
        return card;
      }

      fetch('https://api.github.com/users/' + USER + '/repos?per_page=100&sort=pushed')
        .then((response) => (response.ok ? response.json() : []))
        .then((repos) => {
          const shown = repos.filter(
            (repo) =>
              !repo.fork &&
              !repo.archived &&
              repo.name.toLowerCase() !== '1devi.github.io' &&
              !(repo.topics || []).includes('profile-hide'),
          );
          if (shown.length) document.getElementById('projects').replaceChildren(...shown.map(projectCard));
        })
        .catch(() => {
          // Offline or rate-limited: keep the fallback card.
        });

      // Copy the Discord username; the label confirms it for a moment.
      for (const button of document.querySelectorAll('[data-copy]')) {
        const label = button.querySelector('span');
        const text = label.textContent;
        button.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(button.dataset.copy);
            label.textContent = 'Copied: ' + button.dataset.copy;
          } catch {
            label.textContent = 'Username: ' + button.dataset.copy;
          }
          setTimeout(() => (label.textContent = text), 1600);
        });
      }
    </script>
